<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="p-6 ">
        <header class="flex items-center justify-between mb-4">
            <h1 class="font-bold text-2xl">Item Manager</h1>
            <button id="openCreateBtn" class="bg-sky-400 text-white px-4 py-2 rounded"> + Add Item</button>
        </header>

        <div class="bg-white p-4 rounded hidden" id="formCard">
            <form action="" class="space-y-4" id="itemForm">
                <div>
                    <label class="block text-sm font-medium">Title</label>
                    <input id="title" class="block w-full border border-gray-300 rounded mt-1 p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium">Description</label>
                    <textarea id="description" class="block w-full border border-gray-300 rounded mt-1 p-2" rows="3"></textarea>
                </div>
                <div class="flex gap-2">
                    <button type="button" class="bg-sky-400 px-4 py-2 rounded text-white">Save</button>
                    <button id="cancelBtn" type="button" class="bg-gray-200 px-4 py-2 rounded ">Cancel</button>
                </div>
            </form>
        </div>
        <div class="mb-2">
            <input id="searchInput" type="text" class="w-full border rounded border-gray-300 p-2 mt-4" placeholder="Search by Title ...">
        </div>
        <div class="bg-white p-4 rounded mt-2" id="listCard">
            <table class="table-auto min-w-full">
                <thead>
                    <tr class="border-b">
                        <th class="p-2">Title</th>
                        <th class="p-2">Description</th>
                        <th class="p-2">Action</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody">
                    <tr class="border-b">
                        <td class="p-2">Item 1</td>
                        <td class="p-2">Example description 1</td>
                        <td class="p-2">
                            <button>Edit</button>
                            <button>Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
